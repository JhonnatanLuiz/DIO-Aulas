<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex | JS Developer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        type: {
                            grass: '#74CB48',
                            fire: '#F57D31',
                            water: '#6493EB',
                            bug: '#A7B723',
                            normal: '#AAA67F',
                            poison: '#A43E9E',
                            electric: '#F9CF30',
                            ground: '#DEC16B',
                            fairy: '#E69EAC',
                            fighting: '#C12239',
                            psychic: '#FB5584',
                            rock: '#B69E31',
                            ghost: '#70559B',
                            ice: '#9AD6DF',
                            dragon: '#7037FF',
                            dark: '#75574C',
                            steel: '#B7B9D0',
                            flying: '#A891EC',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">

    <!-- Background Decoration -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-24 -right-24 w-96 h-96 bg-red-500 rounded-full opacity-5 blur-3xl"></div>
        <div class="absolute top-1/2 -left-24 w-72 h-72 bg-blue-500 rounded-full opacity-5 blur-3xl"></div>
    </div>

    <!-- Header -->
    <header class="max-w-7xl mx-auto pt-10 pb-6 px-4 md:px-8">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-600 to-red-400">
                    Pokedex</h1>
                <p class="text-slate-500 mt-1 text-lg">Descubra todo o mundo Pokémon</p>
                <div class="flex gap-3 mt-4 md:mt-0">
                    <button id="game-btn"
                        class="bg-yellow-400 text-yellow-900 px-6 py-2 rounded-full font-bold shadow-lg hover:bg-yellow-300 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z" />
                        </svg>
                        Jogar
                    </button>
                    <button id="compare-mode-btn"
                        class="bg-indigo-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-indigo-500 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M5 4a1 1 0 00-2 0v7.268a2 2 0 000 3.464V16a1 1 0 102 0v-1.268a2 2 0 000-3.464V4zM11 4a1 1 0 10-2 0v1.268a2 2 0 000 3.464V16a1 1 0 102 0V8.732a2 2 0 000-3.464V4zM16 3a1 1 0 011 1v7.268a2 2 0 010 3.464V16a1 1 0 11-2 0v-1.268a2 2 0 010-3.464V4a1 1 0 011-1z" />
                        </svg>
                        Comparar <span id="compare-count"
                            class="hidden bg-white text-indigo-600 text-xs px-2 py-0.5 rounded-full ml-1">0</span>
                    </button>
                </div>
            </div>

            <div class="relative w-full md:w-96 mt-4 md:mt-0">
                <input type="text" id="search-input" placeholder="Buscar Pokemon..."
                    class="w-full pl-12 pr-4 py-3 rounded-2xl border-none shadow-lg shadow-gray-200/50 focus:ring-2 focus:ring-red-400 focus:outline-none transition-all placeholder:text-gray-400 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>

        <!-- Type Filters -->
        <div class="mt-8 overflow-x-auto pb-4 no-scrollbar">
            <div class="flex gap-3" id="type-filters">
                <!-- Filters injected via JS -->
                <button
                    class="bg-gray-800 text-white px-5 py-2 rounded-full text-sm font-semibold shrink-0 shadow-md hover:bg-black transition-all"
                    data-type="all">
                    Todos
                </button>
                <button
                    class="bg-white text-red-500 px-5 py-2 rounded-full text-sm font-semibold shrink-0 shadow-sm hover:shadow-md transition-all flex items-center gap-2"
                    data-type="favorites">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                    Favoritos
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 md:px-8 pb-12">
        <!-- Pokemon Grid -->
        <div id="pokemon-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be injected here via JS -->
            <!-- Loading Skeleton (Initial State) -->
            <div class="animate-pulse bg-white p-4 rounded-3xl h-32 shadow-sm"></div>
            <div class="animate-pulse bg-white p-4 rounded-3xl h-32 shadow-sm"></div>
            <div class="animate-pulse bg-white p-4 rounded-3xl h-32 shadow-sm"></div>
            <div class="animate-pulse bg-white p-4 rounded-3xl h-32 shadow-sm"></div>
        </div>

        <!-- Load More Button -->
        <div class="text-center mt-12 mb-8 hidden" id="load-more-container">
            <button id="load-more-btn"
                class="bg-gray-800 text-white px-8 py-3 rounded-full hover:bg-black transition-colors shadow-lg font-medium">
                Carregar Mais
            </button>
        </div>
    </main>

    <!-- Details Modal -->
    <div id="modal-overlay"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div id="modal-content"
            class="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm md:max-w-2xl overflow-hidden relative transform scale-95 transition-transform duration-300">
            <!-- Close Button -->
            <button onclick="closeModal()"
                class="absolute top-4 left-4 z-10 text-white hover:text-gray-200 p-2 rounded-full bg-white/10 backdrop-blur-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </button> <!-- Changed to back arrow style -->

            <div class="flex flex-col md:flex-row h-full">
                <!-- Header / Image Section -->
                <div id="modal-header-bg"
                    class="w-full md:w-2/5 p-8 flex flex-col items-center justify-center relative bg-red-400 text-white">
                    <span id="modal-id" class="absolute top-6 right-8 font-bold text-2xl opacity-50">#000</span>

                    <div class="relative z-10">
                        <img id="modal-img" src="" alt="" class="w-48 h-48 object-contain drop-shadow-2xl">
                    </div>

                    <div
                        class="absolute bottom-0 text-white/20 text-[6rem] font-bold leading-none -mb-4 truncate w-full text-center">
                        POKE
                    </div>
                </div>

                <!-- Info Section -->
                <div class="w-full md:w-3/5 p-8 flex flex-col h-full overflow-y-auto no-scrollbar">
                    <div class="flex justify-between items-center mb-2">
                        <h2 id="modal-name" class="text-3xl font-bold capitalize text-gray-800">Pokemon</h2>
                        <button id="modal-fav-btn" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-6 w-6 text-gray-300 hover:text-red-500 transition-colors" fill="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                            </svg>
                        </button>
                    </div>

                    <div id="modal-types" class="flex gap-2 mb-6">
                        <!-- Types injected here -->
                    </div>

                    <!-- Description Section -->
                    <div class="mb-6">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-2">Sobre</h3>
                        <p id="modal-description" class="text-gray-600 text-sm leading-relaxed">
                            Carregando descrição...
                        </p>
                    </div>

                    <!-- Stats Tabs -->
                    <div class="mb-6">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Base Stats</h3>
                        <div id="modal-stats" class="space-y-3">
                            <!-- Stats injected here -->
                        </div>
                    </div>

                    <!-- Evolution Chain -->
                    <div>
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Evoluções</h3>
                        <div id="modal-evolution" class="flex items-center justify-between overflow-x-auto pb-2">
                            <!-- Evolution chain injected here -->
                            <p class="text-sm text-gray-400">Carregando...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Minigame Modal -->
    <div id="game-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div
            class="bg-gray-900 rounded-[2rem] border-4 border-yellow-400 p-8 w-full max-w-md text-center relative overflow-hidden">
            <!-- Close Game -->
            <button onclick="closeGameModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <h2 class="text-3xl font-bold text-yellow-400 mb-6 font-mono tracking-widest">QUEM É ESSE POKÉMON?</h2>

            <div
                class="relative w-64 h-64 mx-auto mb-8 bg-white/10 rounded-full flex items-center justify-center border-4 border-white/20">
                <img id="game-img" src=""
                    class="w-48 h-48 object-contain transition-all duration-1000 filter brightness-0 contrast-200"
                    alt="Hidden Pokemon">
            </div>

            <p id="game-feedback" class="h-8 text-xl font-bold mb-4 text-white animate-bounce"></p>

            <div id="game-options" class="grid grid-cols-2 gap-4">
                <!-- Options injected JS -->
            </div>

            <div class="mt-6 flex justify-between items-center text-gray-400 text-sm">
                <span>Streak: <span id="game-streak" class="text-yellow-400 font-bold text-lg">0</span></span>
                <button onclick="startGame()" class="text-yellow-400 hover:underline">Pular / Próximo</button>
            </div>
        </div>
    </div>

    <!-- Comparison Modal -->
    <div id="comparison-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-lg z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-5xl h-[90vh] overflow-y-auto relative flex flex-col">
            <button onclick="closeComparisonModal()"
                class="absolute top-4 right-4 z-20 bg-gray-100 p-2 rounded-full hover:bg-gray-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <div class="p-8 pb-0">
                <h2 class="text-3xl font-bold text-gray-800 text-center">Comparação de Poder</h2>
            </div>

            <div class="flex-1 p-4 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-center"
                id="comparison-content">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
